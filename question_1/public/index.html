<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pendaftaran Karyawan | Huawei</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        huawei: {
                            red: '#CF0A2C', 
                            dark: '#1D1D1D',
                            light: '#F5F5F5'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #e5e7eb;
        }
    </style>
</head>
<body class="text-gray-800">

    <nav class="bg-white border-b border-gray-300 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <span class="text-huawei-red font-bold text-2xl tracking-tighter">HUAWEI</span>
                    <span class="ml-4 pl-4 border-l border-gray-400 text-gray-700 font-semibold">Employee Portal</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Pendaftaran Karyawan Baru</h1>
            <p class="text-gray-600 mt-1">Lengkapi seluruh informasi data diri kandidat di bawah ini.</p>
        </div>

        <div class="bg-white rounded border border-gray-300 shadow-sm overflow-hidden mb-8">
            <div class="bg-gray-100 px-6 py-4 border-b border-gray-300">
                <h2 class="font-semibold text-gray-800">Formulir Data Karyawan</h2>
            </div>
            
            <div class="p-6">
                <form id="employeeForm">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        
                        <div>
                            <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap *</label>
                            <input type="text" id="nama" name="nama" required 
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-huawei-red focus:border-huawei-red text-sm" 
                                placeholder="Sesuai KTP">
                        </div>
                        
                        <div>
                            <label for="umur" class="block text-sm font-medium text-gray-700 mb-1">Usia *</label>
                            <input type="number" id="umur" name="umur" required min="18" max="60"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-huawei-red focus:border-huawei-red text-sm" 
                                placeholder="Dalam tahun">
                        </div>

                        <div>
                            <label for="pendidikan" class="block text-sm font-medium text-gray-700 mb-1">Pendidikan Terakhir *</label>
                            <select id="pendidikan" name="pendidikan" required 
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-huawei-red focus:border-huawei-red text-sm bg-white">
                                <option value="">-- Pilih Pendidikan --</option>
                                <option value="SMA/SMK">SMA / SMK Sederajat</option>
                                <option value="D3">Diploma 3 (D3)</option>
                                <option value="S1">Sarjana (S1)</option>
                                <option value="S2">Magister (S2)</option>
                            </select>
                        </div>

                        <div>
                            <label for="keluarga" class="block text-sm font-medium text-gray-700 mb-1">Status Keluarga</label>
                            <select id="keluarga" name="keluarga" 
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-huawei-red focus:border-huawei-red text-sm bg-white">
                                <option value="Lajang">Lajang</option>
                                <option value="Menikah">Menikah</option>
                                <option value="Cerai">Cerai</option>
                            </select>
                        </div>
                    </div>

                    <div class="space-y-6 mb-6">
                        <div>
                            <label for="alamat" class="block text-sm font-medium text-gray-700 mb-1">Alamat Lengkap KTP *</label>
                            <textarea id="alamat" name="alamat" required rows="2"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-huawei-red focus:border-huawei-red text-sm" 
                                placeholder="Tuliskan alamat lengkap beserta RT/RW, Kelurahan, Kecamatan, dan Kota"></textarea>
                        </div>

                        <div>
                            <label for="pekerjaan" class="block text-sm font-medium text-gray-700 mb-1">Riwayat Pekerjaan Sebelumnya</label>
                            <textarea id="pekerjaan" name="pekerjaan" rows="3"
                                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-1 focus:ring-huawei-red focus:border-huawei-red text-sm" 
                                placeholder="Sebutkan nama perusahaan, posisi, dan masa kerja (opsional)"></textarea>
                        </div>
                    </div>

                    <div class="border-t border-gray-200 pt-6 flex items-center justify-between">
                        <div id="alertMessage" class="hidden text-sm py-2 px-3 rounded border w-1/2" role="alert"></div>
                        <div class="ml-auto">
                            <button type="reset" class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-bold py-2 px-4 rounded text-sm transition duration-150 mr-2">
                                Kosongkan
                            </button>
                            <button type="submit" id="submitBtn"
                                class="bg-huawei-red hover:bg-red-700 text-white font-bold py-2 px-6 rounded text-sm transition duration-150">
                                Simpan Data Pegawai
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="bg-white rounded border border-gray-300 shadow-sm overflow-hidden">
            <div class="bg-gray-100 px-6 py-4 border-b border-gray-300 flex justify-between items-center">
                <h2 class="font-semibold text-gray-800">Daftar Karyawan Terdaftar</h2>
                <button onclick="loadEmployees()" class="text-sm text-huawei-red hover:underline font-medium">
                    Muat Ulang Data
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-300 border-b border-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">No. ID</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Karyawan</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Pendidikan</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Lokasi Asal</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Waktu Daftar</th>
                        </tr>
                    </thead>
                    <tbody id="employeeTableBody" class="bg-white divide-y divide-gray-200 text-sm">
                        <tr>
                            <td colspan="5" class="px-6 py-8 text-center text-gray-500">
                                Memuat data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/data';
        const form = document.getElementById('employeeForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertMessage');
        const tableBody = document.getElementById('employeeTableBody');

        function formatTanggal(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('id-ID', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function showAlert(message, isSuccess = true) {
            alertBox.textContent = message;
            alertBox.className = `text-sm py-2 px-3 rounded border block ${
                isSuccess ? 'bg-green-50 text-green-800 border-green-200' : 'bg-red-50 text-red-800 border-red-200'
            }`;
            
            setTimeout(() => {
                alertBox.className = 'hidden';
            }, 5000);
        }

        async function loadEmployees() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                tableBody.innerHTML = ''; 
                
                if (result.data && result.data.length > 0) {
                    const sortedData = result.data.sort((a, b) => b.id - a.id);
                    
                    sortedData.forEach(item => {
                        let alamatSingkat = item.alamat || '-';
                        if(alamatSingkat.length > 25) alamatSingkat = alamatSingkat.substring(0, 25) + '...';

                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50";
                        tr.innerHTML = `
                            <td class="px-6 py-4 whitespace-nowrap text-gray-600 font-mono text-xs">HW-${item.id.toString().slice(-6)}</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="font-medium text-gray-900">${item.nama || '-'}</div>
                                <div class="text-xs text-gray-500">${item.umur || '?'} Tahun &bull; ${item.keluarga || '-'}</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-gray-700">${item.pendidikan || '-'}</td>
                            <td class="px-6 py-4 text-gray-600" title="${item.alamat || ''}">${alamatSingkat}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-gray-500 text-xs">${formatTanggal(item.createdAt)}</td>
                        `;
                        tableBody.appendChild(tr);
                    });
                } else {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="px-6 py-8 text-center text-gray-500">
                                Belum ada data karyawan terdaftar.
                            </td>
                        </tr>
                    `;
                }
            } catch (error) {
                console.error('Gagal mengambil data:', error);
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-8 text-center text-red-600 font-medium">
                            Terjadi kesalahan saat memuat data. Pastikan server menyala.
                        </td>
                    </tr>
                `;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.textContent = 'Menyimpan...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

            const payload = {
                nama: document.getElementById('nama').value,
                umur: parseInt(document.getElementById('umur').value),
                pendidikan: document.getElementById('pendidikan').value,
                keluarga: document.getElementById('keluarga').value,
                alamat: document.getElementById('alamat').value,
                pekerjaan: document.getElementById('pekerjaan').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    showAlert('Sukses: Data pegawai berhasil disimpan ke sistem.');
                    form.reset();
                    loadEmployees(); 
                } else {
                    const err = await response.json();
                    showAlert(err.error || 'Gagal menyimpan data ke sistem.', false);
                }
            } catch (error) {
                showAlert('Kesalahan jaringan: Server tidak merespons.', false);
            } finally {
                submitBtn.textContent = 'Simpan Data Pegawai';
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });

        loadEmployees();
    </script>
</body>
</html>
